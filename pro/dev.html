<script type="module">

  const { Figure } = await import('./js/figure.js'); const { loadPerson } = await import('./js/people.js'); const { PLAYERS, playerByName, lookAt } = await import('./js/data.js');
  const spec = venueSpec('default', P.get('weather') || 'fair'); const W = WEATHER[spec.weather];

  window.__lab = { fig, p, m, shoot(vw) { const c = gfx.camera, v = { front: [1.6, 1.25, -4.0], back: [-0.8, 1.6, 4.2], side: [4.4, 1.2, -0.2], tv: [0.0, 6.5, 11.0] }[vw] || [-0.8, 1.6, 4.2]; c.position.set(p.x + v[0], v[1], p.z + v[2]); c.lookAt(p.x, 1.0, p.z); c.fov = vw === 'tv' ? 14 : 27; c.updateProjectionMatrix(); A.update(0, 0); gfx.render(0.016); return 1; }, go(u) {

  const W = WEATHER[spec.weather];
